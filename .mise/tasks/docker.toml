["docker:build-debian"]
description = "Build Debian-slim container image (default, with bash & curl)"
run = "docker build --target debian -t github-api-gateway:debian -t github-api-gateway:debian-latest -t github-api-gateway:latest ."

["docker:build-alpine"]
description = "Build minimal Alpine container image (<10MB)"
run = "docker build --target alpine -t github-api-gateway:alpine -t github-api-gateway:alpine-latest ."

["docker:build-distroless"]
description = "Build SOTA hardened zero-trust Distroless container image (<2MB base, 0 CVEs)"
run = "docker build --target distroless -t github-api-gateway:distroless -t github-api-gateway:distroless-latest ."

["docker:build"]
description = "Build all container images (Debian, Alpine, Distroless)"
depends = ["docker:build-debian", "docker:build-alpine", "docker:build-distroless"]

["docker:push-test"]
description = "Tag and push CI/test container flavors (debian, alpine, distroless) to GHCR"
depends = ["docker:build"]
run = '''
OWNER=$(echo "${GITHUB_REPOSITORY_OWNER:-kjaapelania}" | tr '[:upper:]' '[:lower:]')
IMAGE="ghcr.io/${OWNER}/github-api-gateway-test"
if [ -n "${PR_NUMBER:-}" ]; then
  PREFIX="pr-${PR_NUMBER}"
else
  SHA="${GITHUB_SHA:-$(git rev-parse HEAD)}"
  SHORT_SHA=$(echo "$SHA" | cut -c1-7)
  TS=$(date -u +"%Y%m%d-%H%M")
  PREFIX="${TS}-sha-${SHORT_SHA}"
fi
for FLAVOR in debian alpine distroless; do
  TAG="${IMAGE}:${PREFIX}-${FLAVOR}"
  docker tag "github-api-gateway:${FLAVOR}" "${TAG}"
  docker push "${TAG}"
done
'''

["docker:push-release"]
description = "Tag and push production release container flavors (debian, alpine, distroless) to GHCR"
depends = ["docker:build"]
run = '''
OWNER=$(echo "${GITHUB_REPOSITORY_OWNER:-kjaapelania}" | tr '[:upper:]' '[:lower:]')
IMAGE="ghcr.io/${OWNER}/github-api-gateway"
VER="${VERSION:?VERSION environment variable is required (e.g. v0.1.0)}"
for FLAVOR in debian alpine distroless; do
  docker tag "github-api-gateway:${FLAVOR}" "${IMAGE}:${VER}-${FLAVOR}"
  docker tag "github-api-gateway:${FLAVOR}" "${IMAGE}:${FLAVOR}-latest"
  docker push "${IMAGE}:${VER}-${FLAVOR}"
  docker push "${IMAGE}:${FLAVOR}-latest"
done
docker tag "github-api-gateway:debian" "${IMAGE}:latest"
docker push "${IMAGE}:latest"
'''

["docker:run"]
description = "Run default gateway container (Debian)"
run = "docker run --rm -p 28280:28280 -v $(pwd)/policy.yaml:/app/policy.yaml:ro --env-file .env github-api-gateway:debian"

["docker:exec"]
description = "Open an interactive bash shell in the running gateway container"
run = "docker exec -it github-api-gateway bash"

["compose:up"]
description = "Start gateway service via Docker Compose"
run = "docker compose up -d --build"

["compose:down"]
description = "Stop Docker Compose services"
run = "docker compose down"

["compose:logs"]
description = "Follow Docker Compose logs"
run = "docker compose logs -f"

["compose:exec"]
description = "Open an interactive bash shell in the Compose gateway service"
run = "docker compose exec gateway bash"

["compose:ps"]
description = "List running Docker Compose services and status"
run = "docker compose ps"

["compose:reload"]
description = "Hot-reload Compose gateway policy via SIGHUP"
run = "docker compose kill -s HUP gateway"

["compose:obs-up"]
description = "Start gateway with local Prometheus (:28290) and Grafana (:28300) observability stack"
run = "docker compose --profile observability up -d --build"

["compose:obs-down"]
description = "Stop gateway and local Prometheus/Grafana observability stack"
run = "docker compose --profile observability down"
