services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${GITHUB_API_GATEWAY_CONTAINER_TARGET:-debian}
    image: github-api-gateway:${GITHUB_API_GATEWAY_CONTAINER_TARGET:-debian}
    container_name: github-api-gateway
    restart: unless-stopped
    ports:
      - "${GITHUB_API_GATEWAY_PORT:-28280}:28280"
    env_file:
      - path: .env
        required: false
    environment:
      - GITHUB_API_GATEWAY_PORT=28280
      - GITHUB_API_GATEWAY_POLICY_PATH=${GITHUB_API_GATEWAY_POLICY_PATH:-/app/policy.yaml}
      - GITHUB_API_GATEWAY_POLICY_POLL_INTERVAL=${GITHUB_API_GATEWAY_POLICY_POLL_INTERVAL:-}
      - GITHUB_API_GATEWAY_ALLOW_REMOTE_ADMIN=${GITHUB_API_GATEWAY_ALLOW_REMOTE_ADMIN:-false}
      - GITHUB_API_GATEWAY_ADMIN_TOKEN=${GITHUB_API_GATEWAY_ADMIN_TOKEN:-}
      - GITHUB_API_GATEWAY_TOKENS=${GITHUB_API_GATEWAY_TOKENS:-}
      - GITHUB_API_GATEWAY_AUTH_KEYS=${GITHUB_API_GATEWAY_AUTH_KEYS:-}
      - GITHUB_API_GATEWAY_TOKEN_MIN_REMAINING=${GITHUB_API_GATEWAY_TOKEN_MIN_REMAINING:-3000}
      - GITHUB_API_GATEWAY_FALLBACK_UNAUTHENTICATED=${GITHUB_API_GATEWAY_FALLBACK_UNAUTHENTICATED:-true}
      - GITHUB_API_GATEWAY_CACHE_TTL_SECONDS=${GITHUB_API_GATEWAY_CACHE_TTL_SECONDS:-300}
      - GITHUB_API_GATEWAY_TARGET_URL=${GITHUB_API_GATEWAY_TARGET_URL:-https://api.github.com}
      - GITHUB_API_GATEWAY_CLIENT_MAX_RPM=${GITHUB_API_GATEWAY_CLIENT_MAX_RPM:-60}
      - GITHUB_API_GATEWAY_CLIENT_BURST=${GITHUB_API_GATEWAY_CLIENT_BURST:-10}
    volumes:
      - ./policy.yaml:/app/policy.yaml:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/gateway", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: github-api-gateway-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GITHUB_API_GATEWAY_PROMETHEUS_PORT:-28290}:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: github-api-gateway-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "${GITHUB_API_GATEWAY_GRAFANA_PORT:-28300}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_DEFAULT_THEME=dark
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/github-api-gateway.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
