[tools]
go = "latest"

[env]
GITHUB_API_GATEWAY_PORT = "8080"
GITHUB_API_GATEWAY_TOKEN_MIN_REMAINING = "3000"
GITHUB_API_GATEWAY_FALLBACK_UNAUTHENTICATED = "true"
GITHUB_API_GATEWAY_POLICY_PATH = "policy.yaml"

[tasks.run]
description = "Run gateway locally"
run = "go run ./cmd/gateway"

[tasks.reload]
description = "Hot-reload gateway policy and keys without restart"
run = "curl -i -X POST http://localhost:8080/_gateway/reload"

[tasks.status]
description = "Query gateway status and telemetry"
run = "curl -s http://localhost:8080/_gateway/status | jq ."

[tasks.test]
description = "Run all Go unit and integration tests"
run = "go test -v ./..."

[tasks.watch]
description = "Continuously run tests (ideal for Herdr test-watcher pane)"
run = "while true; do clear; go test -v ./... || true; sleep 2; done"

[tasks.build]
description = "Build gateway binary locally"
run = "go build -o bin/gateway ./cmd/gateway"

[tasks."docker:build"]
description = "Build minimal Docker container image"
run = "docker build -t github-api-gateway:latest ."

[tasks."docker:run"]
description = "Run gateway in Docker container"
run = "docker run --rm -p 8080:8080 -v $(pwd)/policy.yaml:/app/policy.yaml:ro --env-file .env github-api-gateway:latest"

[tasks."compose:up"]
description = "Start gateway service via Docker Compose"
run = "docker compose up -d --build"

[tasks."compose:down"]
description = "Stop Docker Compose services"
run = "docker compose down"

[tasks."compose:logs"]
description = "Follow Docker Compose logs"
run = "docker compose logs -f"
